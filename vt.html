<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VT">
<title>VT</title>
<style>
:root{--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
html,body{margin:0;background:#fff;font:14px/1.4 -apple-system,sans-serif}
#m{position:absolute;top:120px;left:12px;right:12px;white-space:pre;font:12px ui-monospace,monospace}
.bar{position:fixed;left:0;right:0;height:30px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
#a{bottom:0;background:#e11}                 /* A: fixed bottom:0 */
#b{top:calc(100lvh - 30px);background:#16a} /* B: fixed top at 100lvh */
#c{top:calc(100dvh - 30px);background:#1a6;left:50%} /* C: fixed top at 100dvh */
#probe{position:fixed;top:0;bottom:0;width:1px;left:0}
#lvh{position:absolute;top:0;height:100lvh;width:1px}#dvh{position:absolute;top:0;height:100dvh;width:1px}#svh{position:absolute;top:0;height:100svh;width:1px}
#st{position:absolute;height:var(--st)}#sb{position:absolute;height:var(--sb)}
</style></head><body>
<div id="probe"></div><div id="lvh"></div><div id="dvh"></div><div id="svh"></div><div id="st"></div><div id="sb"></div>
<input id="i" placeholder="tap me (keyboard)" style="position:absolute;top:60px;left:12px;font-size:16px">
<div id="m"></div>
<div class="bar" id="a">A bottom:0</div><div class="bar" id="b">B 100lvh</div><div class="bar" id="c">C 100dvh</div>
<script>
const h=id=>Math.round(document.getElementById(id).getBoundingClientRect().height);
function show(){const vv=visualViewport;document.getElementById('m').textContent=
`standalone ${navigator.standalone} screen ${screen.height}
innerHeight ${innerHeight}  clientHeight ${document.documentElement.clientHeight}
vv.height ${Math.round(vv.height)} vv.offsetTop ${Math.round(vv.offsetTop)} scrollY ${scrollY}
fixed inset0 ${h('probe')}  100lvh ${h('lvh')}  100dvh ${h('dvh')}  100svh ${h('svh')}
safe top ${h('st')}  safe bottom ${h('sb')}
A bottom ${Math.round(document.getElementById('a').getBoundingClientRect().bottom)}`;}
show();setInterval(show,500);
</script></body></html>
